[General]
site_name = cu2home
site_description = Portal inmobiliario en Cuba
default_language = es

[Search]
engine_host = http://localhost:7700
results_per_page = 20

[Maps]
tile_layer_url = https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
tile_layer_attribution = © OpenStreetMap contributors
default_center_lat = 23.0
default_center_lng = -82.0
default_zoom = 7

[LLM]
modelos = llama-3.3-70b-versatile,mixtral-8x7b-32768,gemma2-9b-it

[Thresholds]
confidence_auto = -1.05
confidence_review = 0.8

[Logging]
nivel_desarrollo = DEBUG
nivel_produccion = INFO
log_file = cu2home.log
max_bytes = 10485760
backup_count = 10

[Email]
smtp_server = mail.fixalius.com
smtp_port = 465
smtp_use_tls = true
smtp_user = acuesta@fixalius.com

[Batch]
limit_min = true
limit_max = 500
delay_min = true
delay_max = 5

[Properties]
max_images_per_property = 10