{% extends 'dashboard/base_dashboard.html' %}
{% load i18n %}

{% block dashboard_content %}
<div class="p-6">
    <h1 class="text-2xl font-serif text-[#1a3a5c]">{% trans "Configuration" %}</h1>
    <form method="post" class="mt-6 bg-white p-6 rounded-2xl shadow-sm border border-[#e5e0da]">
        {% csrf_token %}
        {% for section, items in sections.items %}
        <div class="mb-6">
            <h2 class="text-lg font-semibold text-[#2c2a28] border-b border-[#e5e0da] pb-2">{{ section }}</h2>
            {% for key, value in items.items %}
            <div class="flex items-center gap-4 mt-3">
                <label class="w-1/3 text-sm text-[#6b6560]">{{ key }}</label>
                <input type="text" name="{{ section }}__{{ key }}" value="{{ value }}" 
                       class="w-2/3 px-3 py-2 rounded-full border border-[#e5e0da] bg-[#faf9f6] focus:ring-2 focus:ring-[#1a3a5c]/20 focus:outline-none">
            </div>
            {% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="bg-[#1a3a5c] text-white px-6 py-2 rounded-full hover:bg-[#143049] transition">{% trans "Save" %}</button>
    </form>
</div>
{% endblock %}
