{% extends "core/base.html" %}
{% load static i18n %}

{% block title %}{{ title }} - {{ block.super }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/22.1.7/css/dx.light.css">
<link rel="stylesheet" href="{% static 'users/css/my_favorites.css' %}">
{% endblock %}

{% block content %}
<div class="list-page">
    <div class="list-page-head">
        <h1><i class="fas fa-heart"></i>{{ title }}</h1>
        <a href="{% url 'properties:list' %}" class="back-link">
            <i class="fas fa-arrow-left"></i> {% trans "Volver al portal" %}
        </a>
    </div>

    <div class="grid-wrapper">
        <div id="favoritesGrid"></div>
    </div>
</div>

<!--
    Contrato real de views.favorites_data (GET) -- un objeto por fila:
        favorite_id, property_id, codigo (slug), tipo, tipo_raw,
        ubicacion, oferta, precio, superficie, estado, anadido
        ('dd/mm/yyyy' ya formateado), detail_url.
    URLS.remove es la misma URL de views.toggle_favorite (POST,
    property_id en el path): togglear un favorito ya existente lo
    elimina, así que se reutiliza tal cual para "quitar de favoritos"
    -- no hay ni hace falta un endpoint de borrado dedicado.
-->
<script id="urls-config" type="application/json">
{
    "data": "{% url 'users:favorites_data' %}",
    "remove": "{% url 'users:toggle_favorite' 0 %}"
}
</script>
<script>
    window.csrfToken = '{{ csrf_token }}';
</script>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn3.devexpress.com/jslib/22.1.7/js/dx.all.js"></script>
<script src="https://cdn3.devexpress.com/jslib/22.1.7/js/localization/dx.messages.es.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="{% static 'users/js/my_favorites.js' %}"></script>
{% endblock %}
