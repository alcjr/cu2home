{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Registro" %}{% endblock %}

{% block content %}
<div class="container">
    <h1>{% trans "Crear cuenta" %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">{% trans "Registrarse" %}</button>
    </form>
    <p>{% trans "¿Ya tienes cuenta?" %} <a href="{% url 'authentication:login' %}">{% trans "Iniciar sesión" %}</a></p>
</div>
{% endblock %}
